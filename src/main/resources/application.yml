server:
  port: 8081

spring:
  application:
    name: xunwei
  # 真实凭据放 application-local.yml（已 gitignore），这里只给可覆盖的默认值
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/xunwei?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    # 不写默认口令：本文件进公开仓库，本机口令放 application-local.yml（已 gitignore）或环境变量
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 有密码时在 application-local.yml 里补 password
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    # 前端按需取字段，null 不返回可以显著缩小响应体
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.lanmei.xunwei.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.lanmei.xunwei: debug
  pattern:
    # HH 是小时，mm 是分钟
    dateformat: "HH:mm:ss.SSS"
